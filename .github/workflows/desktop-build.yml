name: Desktop Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip build output
        run: |
          cd build/windows/x64/runner/Release
          7z a -r ../../../../../hidroly-windows.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidroly-windows
          path: hidroly-windows.zip

  linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Assemble AppDir
        run: |
          APP_NAME=hidroly
          BUNDLE_DIR=build/linux/x64/release/bundle
          APPDIR=AppDir

          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          # Desktop entry
          cat > "$APPDIR/$APP_NAME.desktop" <<EOF
          [Desktop Entry]
          Name=Hidroly
          Exec=$APP_NAME
          Icon=$APP_NAME
          Type=Application
          Categories=Utility;
          EOF

          # Icon: pubspec.yaml has no shared icon asset (no assets/icon/, no
          # flutter_launcher_icons), so there's no known source PNG yet.
          # TODO: point this at the real icon once you confirm its path
          # (e.g. a platform-specific icon or a logo file in the repo),
          # otherwise the AppImage ships with a blank icon.
          if [ -f "assets/icon/icon.png" ]; then
            cp assets/icon/icon.png "$APPDIR/$APP_NAME.png"
          else
            echo "No known icon source - AppImage will have a blank icon until this is fixed" >&2
            touch "$APPDIR/$APP_NAME.png"
          fi

          # AppRun
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/hidroly" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      - name: Build AppImage
        run: ./appimagetool-x86_64.AppImage AppDir hidroly-linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidroly-linux
          path: hidroly-linux-x86_64.AppImage

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app ../../../../../hidroly-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidroly-macos
          path: hidroly-macos.zip

  release:
    name: Attach to GitHub Release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hidroly-windows/hidroly-windows.zip
            dist/hidroly-linux/hidroly-linux-x86_64.AppImage
            dist/hidroly-macos/hidroly-macos.zip
